services:
  - type: web
    name: tunetube-converter
    runtime: node
    plan: free
    buildCommand: npm install && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o yt-dlp && chmod a+rx yt-dlp
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: downloads
      mountPath: /opt/render/project/src/downloads
      sizeGB: 1
